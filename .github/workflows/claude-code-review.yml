name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR. A new push cancels the review still running against the
# previous commit, so rapid pushes do not queue up stale reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the reviewer posts inline comments and a summary.
      # With read it runs, finds nothing it can say, and exits silently.
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history. fetch-depth: 1 leaves no base branch to diff against,
          # so the reviewer cannot see the change as a change.
          fetch-depth: 0

      # Optional but recommended. Without dependencies the reviewer cannot run
      # the build or the type checker, so it cannot confirm what the PR body
      # claims, and it will say so in every review. Match this to your stack, or
      # delete it and accept unverified build claims.
      #
      # - name: Install dependencies
      #   run: npm ci
      #   working-directory: ./

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # Newer Claude Code launches subagents in the background by default. In
        # CI that is fatal: the reviewer fans out to its rubric agents, ends its
        # turn "waiting for them", the session exits, and the run goes green
        # having posted nothing. This forces every subagent to run in the
        # foreground so the reviewer gets the results back in the same turn.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # Uses skills/deep-review/SKILL.md from this repo rather than the
          # stock code-review plugin. The plugin stops as soon as it has
          # commented once on a PR, so it never re-reviews a push, and it
          # deliberately flags only compile errors and CLAUDE.md violations.
          prompt: |
            Read the file skills/deep-review/SKILL.md in this repository and
            follow it exactly to review pull request
            #${{ github.event.pull_request.number }} of
            ${{ github.repository }}.

            Pass --comment: post the inline comments and the summary comment
            ending in the verdict line, exactly as the skill describes.

            Open with the "In short" line the skill describes: one or two plain
            sentences, no identifiers, no file paths, no jargon, aimed at someone
            who runs the business rather than the build. The technical detail
            goes below it, not in it.

            Keep the posted review short. At most five findings, each under 100
            words, tagged P0 to P3. Do not show your reasoning and do not restate
            the diff.

            Run every subagent in the foreground and wait for its result. Never
            end your turn while a subagent is still running: this is a one-shot
            CI session, and ending the turn exits it with nothing posted. The
            run is only finished once the summary comment is on the PR.

            Review this PR even if you have already commented on it before. The
            head commit has changed, so the previous review is stale. Review the
            current head, ${{ github.event.pull_request.head.sha }}.

          # --allowedTools is variadic, so no tool spec here may contain a space.
          # Bash(gh pr view:*) would word-split into three broken specs; Bash(gh:*)
          # is equivalent for our purposes and survives the split.
          # --max-turns is raised because the rubric fans out to parallel review
          # subagents and then one verification subagent per finding. On the old
          # default the review truncated and posted a partial verdict.
          claude_args: |
            --allowedTools Bash(gh:*),Bash(git:*),Read,Grep,Glob,Task,TodoWrite,mcp__github_inline_comment__create_inline_comment
            --max-turns 80
            --model claude-opus-5
